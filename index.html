<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>清邁七日旅行日記</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap');

        :root {
            --primary: #123334;
            --accent: #ffd36d;
            --bg: #f8f7f3;
            --text-main: #2d2d2d;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body { margin: 0; background: var(--bg); font-family: 'Noto Sans TC', sans-serif; color: var(--text-main); line-height: 1.8; }

        /* --- Header --- */
        .hero {
            height: 70vh;
            color: #fff;
            background: linear-gradient(rgba(18,51,52,0.7), rgba(18,51,52,0.3)), 
                        url('https://images.unsplash.com/photo-1528181304800-259b08848526?auto=format&fit=crop&w=1800&q=85') center/cover;
            display: flex;
            flex-direction: column;
        }

        .wrap { max-width: 900px; margin: auto; padding: 0 30px; width: 100%; }

        /* 頂部導覽列 */
        .top-nav {
            height: 90px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font: 700 1.2rem 'Playfair Display'; letter-spacing: 0.1em; }
        
        /* 地圖連結按鈕樣式 */
        .map-btn-top {
            text-decoration: none;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 6px 15px;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            transition: all 0.3s;
        }
        .map-btn-top:hover { background: var(--accent); color: var(--primary); }

        .hero-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 50px; }
        .hero h1 { font: 500 clamp(3.5rem, 10vw, 7rem)/0.85 'Playfair Display'; margin: 20px 0; }
        .hero i { color: var(--accent); font-style: normal; }

        /* --- 固定日期與地圖導覽列 --- */
        .sticky-nav-wrapper {
            position: sticky;
            top: 0;
            background: rgba(248, 247, 243, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 15px 0;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .date-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }
        .date-tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            text-decoration: none;
            color: var(--primary);
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 14px;
            border: 1px solid var(--primary);
            border-radius: 50px;
            transition: all 0.3s;
        }
        .tab-btn:hover, .tab-btn.active { background: var(--primary); color: var(--accent); }

        /* 第二個地圖連結（放在日期列旁） */
        .map-link-text {
            text-decoration: none;
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            border-left: 1px solid #ddd;
            padding-left: 15px;
            margin-left: 10px;
        }

        /* --- 行程內容 --- */
        .main-content { padding: 60px 0; }
        .day-card {
            background: #fff;
            padding: 50px;
            margin-bottom: 80px;
            border-radius: 2px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.03);
            position: relative;
        }
        .day-card::before { content: ""; display: block; height: 100px; margin-top: -100px; visibility: hidden; }

        .day-num { font-family: 'Playfair Display'; font-size: 3rem; color: #eee; position: absolute; top: 30px; right: 50px; }
        .day-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 25px; color: var(--primary); }

        ul { list-style: none; padding: 0; }
        li { position: relative; padding-left: 25px; margin-bottom: 12px; }
        li::before { content: ""; position: absolute; left: 0; top: 12px; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }

        .photo-placeholder {
            width: 100%; height: 350px; background: #eee center/cover no-repeat; margin-top: 30px; border-radius: 4px;
        }

        footer { text-align: center; padding: 60px 0; color: #999; font-size: 0.8rem; }

        @media(max-width:650px){
            .top-nav { height: 70px; }
            .day-card { padding: 30px 20px; }
            .map-link-text { display: none; } /* 手機版隱藏文字版地圖連結以免擠擁 */
        }
    </style>
</head>
<body>

<header class="hero">
    <div class="wrap">
        <nav class="top-nav">
            <span class="logo">CHIANG MAI / 2026</span>
            <!-- 這裡放你的 Google Map 連結 -->
            <a href="https://www.google.com/maps" target="_blank" class="map-btn-top">OPEN MAP</a>
        </nav>
        <div class="hero-content">
            <div class="eyebrow" style="color:var(--accent); letter-spacing:.3em; font-weight:700; font-size:.8rem; margin-bottom: 10px;">A SEVEN DAY TRAVEL NOTE</div>
            <h1>Dear,<br><i>Chiang Mai.</i></h1>
            <p>2026.08.02 — 08.08</p>
        </div>
    </div>
</header>

<!-- 固定導覽列 -->
<div class="sticky-nav-wrapper">
    <div class="wrap">
        <div class="nav-container">
            <nav class="date-tabs">
                <a href="#day01" class="tab-btn">D1</a>
                <a href="#day02" class="tab-btn">D2</a>
                <a href="#day03" class="tab-btn">D3</a>
                <a href="#day04" class="tab-btn">D4</a>
                <a href="#day05" class="tab-btn">D5</a>
                <a href="#day06" class="tab-btn">D6</a>
                <a href="#day07" class="tab-btn">D7</a>
            </nav>
            <!-- 日期列旁的地圖連結 -->
            <a href="https://www.google.com/maps" target="_blank" class="map-link-text">
                📍 Full Map
            </a>
        </div>
    </div>
</div>

<main class="main-content">
    <div class="wrap">
        
        <!-- Day 01 -->
        <article class="day-card" id="day01">
            <div class="day-num">01</div>
            <h2 class="day-title">抵達清邁：尼曼區的午後</h2>
            <ul>
                <li>搭乘飛機抵達清邁國際機場 (CNX)</li>
                <li>尼曼區 Check-in</li>
                <li>One Nimman 藝術街區散步</li>
            </ul>
            <div class="photo-placeholder" style="background-image: url('https://images.unsplash.com/photo-1590332822765-72861e68022a?auto=format&fit=crop&w=800&q=80')"></div>
        </article>

        <!-- Day 02 -->
        <article class="day-card" id="day02">
            <div class="day-num">02</div>
            <h2 class="day-title">古城探索與寺廟洗禮</h2>
            <ul>
                <li>租借機車，深入古城小巷</li>
                <li>參拜柴迪隆寺 Wat Chedi Luang</li>
            </ul>
        </article>

        <!-- Day 03 以此類推... -->

    </div>
</main>

<footer>
    <div class="wrap">
        &copy; 2026 CHIANG MAI TRAVEL DIARY.
    </div>
</footer>

<script>
    // 滾動時自動標註當前天數
    window.addEventListener('scroll', () => {
        const sections = document.querySelectorAll('.day-card');
        const navLinks = document.querySelectorAll('.tab-btn');
        let current = "";
        sections.forEach(section => {
            const sectionTop = section.offsetTop;
            if (pageYOffset >= sectionTop - 150) {
                current = section.getAttribute('id');
            }
        });
        navLinks.forEach(link => {
            link.classList.remove('active');
            if (link.getAttribute('href').includes(current)) {
                link.classList.add('active');
            }
        });
    });
</script>

</body>
</html>
