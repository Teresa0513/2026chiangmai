<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>清邁七日旅行日記</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap');

        :root {
            --primary-dark: #123334;
            --accent: #ffd36d;
            --bg-sand: #f8f7f3;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body { 
            margin: 0; 
            background: var(--bg-sand); 
            font-family: 'Noto Sans TC', sans-serif;
            color: var(--primary-dark);
            line-height: 1.6;
        }

        /* 增強：Hero 區塊加上微過渡與視差感 */
        .hero {
            min-height: 100vh; /* 改為滿版 */
            display: flex;
            flex-direction: column;
            color: #fff;
            background: linear-gradient(90deg, rgba(18,51,52,0.9), rgba(18,51,52,0.25)), 
                        url('https://images.unsplash.com/photo-1528181304800-259b08848526?auto=format&fit=crop&w=1800&q=85') center/cover;
            background-attachment: fixed; /* 視差效果 */
        }

        .wrap { max-width: 1080px; margin: auto; padding: 0 26px; width: 100%; }

        nav {
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: .75rem;
            letter-spacing: .15em;
            text-transform: uppercase;
        }

        .logo { font: 700 1.4rem 'Playfair Display'; }

        .copy { 
            padding-top: 12vh; 
            animation: fadeInUp 1s ease-out; /* 登場動畫 */
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .eyebrow { color: var(--accent); font-size: .75rem; letter-spacing: .2em; font-weight: 500; }

        .hero h1 { 
            font: 500 clamp(3.5rem, 10vw, 8rem)/0.9 'Playfair Display'; 
            letter-spacing: -.05em; 
            margin: 24px 0; 
        }

        .hero i { color: var(--accent); font-style: normal; }

        .hero p { 
            max-width: 400px; 
            line-height: 2; 
            opacity: 0.9;
            font-weight: 300;
        }

        /* 改進：Iframe 容器 */
        .frame-container {
            width: 100%;
            background: var(--bg-sand);
            padding-top: 50px;
        }

        .frame {
            display: block;
            border: 0;
            width: 100%;
            height: 2500px; /* 這裡仍建議內容改為直接寫入 HTML */
            transition: opacity 0.5s;
        }

        /* 頁尾 */
        footer {
            padding: 100px 0 50px;
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.6;
            letter-spacing: 0.1em;
        }

        @media(max-width:650px){
            .hero { background-attachment: scroll; } /* 手機關閉視差提升效能 */
            .copy { padding-top: 80px; }
            .hero h1 { margin: 15px 0; }
        }
    </style>
</head>
<body>

<header class="hero">
    <div class="wrap">
        <nav>
            <span class="logo">CHIANG MAI / 2026</span>
            <span>02 — 08 AUGUST</span>
        </nav>
        <div class="copy">
            <div class="eyebrow">A SEVEN DAY TRAVEL NOTE</div>
            <h1>Dear,<br><i>Chiang Mai.</i></h1>
            <p>從尼曼的晨光、古城的巷子，到夜市裡的香氣。這次，不趕行程，我們慢慢走。</p>
        </div>
    </div>
</header>

<main class="frame-container">
    <!-- 如果在同網域，這段 JS 才有作用 -->
    <iframe id="itinerary" class="frame" src="chiangmai-detailed-itinerary.html" scrolling="no"></iframe>
</main>

<footer>
    <div class="wrap">
        &copy; 2026 TRAVEL DIARY. CREATED WITH LOVE.
    </div>
</footer>

<script>
    // 嘗試動態調整 iframe 高度 (需同網域)
    const iframe = document.getElementById('itinerary');
    iframe.onload = function() {
        try {
            // 隱藏內部特定元素
            const innerDoc = iframe.contentDocument || iframe.contentWindow.document;
            const topEl = innerDoc.querySelector('.top');
            const tabsEl = innerDoc.querySelector('.tabs');
            if(topEl) topEl.style.display = 'none';
            if(tabsEl) tabsEl.style.display = 'none';
            
            // 自動調整高度（簡單範例）
            iframe.style.height = innerDoc.documentElement.scrollHeight + 'px';
        } catch (e) {
            console.log("CORS block or other error: ", e);
        }
    };
</script>

</body>
</html>
